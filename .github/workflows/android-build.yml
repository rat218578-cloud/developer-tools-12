name: Android Build (android-12-candidate)

# Compila o APK debug e roda o lint.
# Nao faz commit, publicacao ou distribuicao: apenas gera um artifact para download.

on:
  push:
    branches:
      - android-12-candidate
  pull_request:
    branches:
      - android-12-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + lintDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK Platform 35 and Build Tools 35.0.0
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK and run lint
        # Gradle 8.5 e definido pelo wrapper do projeto (gradle/wrapper/gradle-wrapper.properties).
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Print full lint report on failure
        if: failure()
        run: |
          REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          if [ -f "$REPORT" ]; then cat "$REPORT"; else echo "Lint text report not found"; fi

      - name: Verify APK was generated
        run: |
          APK_DIR=app/build/outputs/apk/debug
          ls -la "$APK_DIR"
          test -f "$APK_DIR/app-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14
